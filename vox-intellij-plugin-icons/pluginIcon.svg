<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#180A35"/>
      <stop offset="0.52" stop-color="#0A183F"/>
      <stop offset="1" stop-color="#120827"/>
    </linearGradient>
    <linearGradient id="vox" x1="24" y1="28" x2="104" y2="103" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F14CFF"/>
      <stop offset="0.47" stop-color="#7756FF"/>
      <stop offset="1" stop-color="#30D8FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>
  <rect x="6.5" y="6.5" width="115" height="115" rx="25.5" stroke="#6F4AFF" stroke-opacity=".35"/>

  <!-- Stylized V -->
  <path d="M27 31L53.2 92.5C56.5 100.2 60 105 64 105C68 105 71.5 100.2 74.8 92.5L101 31"
        stroke="url(#vox)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Microphone capsule -->
  <rect x="52" y="33" width="24" height="36" rx="12" fill="url(#vox)"/>
  <rect x="58" y="42" width="12" height="3.6" rx="1.8" fill="#0E1230"/>
  <rect x="58" y="49.5" width="12" height="3.6" rx="1.8" fill="#0E1230"/>
  <rect x="58" y="57" width="12" height="3.6" rx="1.8" fill="#0E1230"/>

  <!-- Mic cradle -->
  <path d="M48 58V61C48 71.5 55.2 79 64 79C72.8 79 80 71.5 80 61V58"
        stroke="url(#vox)" stroke-width="6" stroke-linecap="round"/>
  <path d="M64 79V90" stroke="url(#vox)" stroke-width="6" stroke-linecap="round"/>
</svg>
