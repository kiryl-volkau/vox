# Project glossary: spoken form -> canonical engineering term.
#
# How it is used:
#   * the canonical terms are joined and passed to Whisper as hotwords (initial_prompt), which
#     biases recognition towards them;
#   * the whole mapping is rendered as a vocabulary block and injected into the LLM prompt, so the
#     model knows that "мембершип" heard in Russian speech means the identifier "membership".
#
# How it is NOT used: no blind string replacement is ever performed on the transcript. Nothing here
# rewrites the user's words; these are hints only. Adding an entry can never corrupt a sentence that
# happened to contain the same syllables.
#
# Keys are lowercase spoken forms as they come out of the recognizer; values are what should appear
# in the final text.
#
# A value is written in one of two forms:
#   * a plain string - the same spelling is used whatever language the answer is written in. This
#     is right for identifiers and for English terms that are kept as-is in every language;
#   * a mapping of language code to spelling - used when the two languages legitimately differ, so
#     the same Russian speech yields "постановка задачи" in a Russian answer and "task statement"
#     in an English one. A language the entry does not mention simply drops out of that language's
#     vocabulary block rather than borrowing another language's spelling.
#
# Whisper hotwords are taken from every spelling in every language, because what is spoken does not
# depend on the language the answer will be written in.

