pluginGroup=dev.vox
pluginVersion=0.1.0
pluginSinceBuild=262

# Build against the IDE installed on this machine, so the compile classpath is exactly the
# API the plugin will run on. Left blank on purpose: the path is per-machine, so set it in
# ~/.gradle/gradle.properties or pass -PplatformLocalPath=... rather than committing yours.
# Blank means platformVersion is downloaded from JetBrains instead, which is what CI does.
platformLocalPath=
platformVersion=2026.2.2

# The IDE ships Kotlin 2.4.0; bundling a second stdlib into the plugin zip would shadow it.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.parallel=true
