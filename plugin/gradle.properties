pluginGroup=dev.vox
pluginVersion=0.1.0
pluginSinceBuild=262

# The plugin is built against the IDE that is installed on this machine, so the compile
# classpath is exactly the API the plugin will run on. Blank the path to download
# platformVersion from JetBrains instead.
platformLocalPath=C:/Users/skiri/AppData/Local/Programs/IntelliJ IDEA Ultimate
platformVersion=2026.2.2

# The IDE ships Kotlin 2.4.0; bundling a second stdlib into the plugin zip would shadow it.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.parallel=true
