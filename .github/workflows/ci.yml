name: CI

# The backend is the only Python left in the repository and it runs on Linux, which is what
# its image is built on.
#
# The integration and eval suites are deliberately absent: both need a running backend with
# CUDA and a live language model behind it, which no hosted runner has. A suite that cannot
# pass on CI only teaches people to ignore a red build.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Pinned exactly: setup-uv publishes no floating major tag, so @v10 does not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # uv provides the interpreter rather than the runner, exactly as the Dockerfile does,
      # so CI and the container agree on the version the project requires.
      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --extra server

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy src tests

      - name: Unit tests
        run: uv run pytest tests/unit
