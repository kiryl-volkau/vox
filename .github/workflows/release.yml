name: Release

# Two artefacts, two jobs, one tag vocabulary. The repository ships a plugin you install into
# an IDE and a backend image you run in Docker; they version independently in practice, so the
# tag prefix decides what gets built:
#
#   v1.2.3          both
#   plugin-v1.2.3   the IntelliJ plugin zip only
#   backend-v1.2.3  the backend image only
#
# Each job is skipped when the tag is not for it, so releasing one component never rebuilds
# the other - a plugin fix should not push a five-gigabyte CUDA image nobody asked for.
on:
  push:
    tags:
      - "v*"
      - "plugin-v*"
      - "backend-v*"

permissions:
  contents: write
  packages: write

jobs:
  plugin:
    name: plugin zip
    if: ${{ !startsWith(github.ref_name, 'backend-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Building the plugin is plain JVM work; only running the IDE needs a JetBrains Runtime.
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#plugin-}"
          tag="${tag#v}"
          declared=$(sed -n 's/^pluginVersion=//p' plugin/gradle.properties)
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, plugin/gradle.properties says $declared"
            exit 1
          fi

      # platformLocalPath is blank in the repository, so this downloads platformVersion from
      # JetBrains rather than looking for an IDE that is not installed here.
      - name: Build the plugin
        working-directory: plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls plugin/build/distributions/*.zip)
          echo "built $zip"
          gh release create "$GITHUB_REF_NAME" "$zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            || gh release upload "$GITHUB_REF_NAME" "$zip" --clobber

  backend:
    name: backend image
    if: ${{ !startsWith(github.ref_name, 'plugin-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # The CUDA base image is around three gigabytes and the runner ships with a lot it will
      # never need; reclaiming first is cheaper than failing halfway through the build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Work out the version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#backend-}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vox-backend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/vox-backend:latest
